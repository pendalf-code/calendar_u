<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Календарь</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/themes.css?v=6">
<link rel="stylesheet" href="css/base.css?v=6">
<link rel="stylesheet" href="css/calendar.css?v=6">
<link rel="stylesheet" href="css/modal.css?v=6">
<link rel="stylesheet" href="css/select.css?v=6">
<link rel="stylesheet" href="css/responsive.css?v=6">
</head>
<body>

<header class="app-header">
  <div class="app-title"><span class="dot"></span><span class="title-text">Календарь</span></div>

  <div class="nav-group">
    <button class="nav-btn" id="prevBtn" title="Назад" aria-label="Назад"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="today-btn" id="todayBtn">Сегодня</button>
    <button class="nav-btn" id="nextBtn" title="Вперёд" aria-label="Вперёд"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>

  <div class="current-label" id="currentLabel" aria-live="polite"></div>

  <div class="view-switch" role="group" aria-label="Вид календаря">
    <button class="view-btn" data-view="day">День</button>
    <button class="view-btn" data-view="week">Неделя</button>
    <button class="view-btn active" data-view="month">Месяц</button>
  </div>

  <div class="search-box" id="searchBox">
    <svg class="search-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="text" id="searchInput" placeholder="Поиск событий" autocomplete="off" aria-label="Поиск по названию и месту">
    <button type="button" class="search-clear" id="searchClear" title="Очистить" aria-label="Очистить поиск" hidden>
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="search-results" id="searchResults" hidden></div>
  </div>

  <div class="filter-select select-wrapper" id="filterWrap">
    <select id="categoryFilter" aria-label="Фильтр по категории события"></select>
  </div>

  <div class="header-spacer"></div>

  <div class="header-menu">
  <button class="icon-btn menu-btn" id="menuBtn" title="Меню" aria-label="Меню" aria-haspopup="true" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
  </button>
  <div class="header-actions" id="headerActions">
    <button class="icon-btn" id="settingsBtn" title="Настройки" aria-label="Настройки">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33h0a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51h0a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v0a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span class="btn-text">Настройки</span>
    </button>
    <button class="icon-btn" id="gistSyncBtn" title="Синхронизировать с Gist" aria-label="Синхронизировать с Gist">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 01-15.5 6.2L3 16"/><path d="M3 12a9 9 0 0115.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/></svg>
      <span class="btn-text">Синхр.</span>
    </button>
    <button class="icon-btn" id="gistBtn" title="Настроить GitHub Gist синхронизацию" aria-label="GitHub Gist">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z"/></svg>
      <span class="btn-text">Gist</span>
    </button>
    <button class="icon-btn primary" id="exportBtn" title="Экспорт в JSON" aria-label="Экспорт в JSON">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      <span class="btn-text">Экспорт</span>
    </button>
  </div>
  </div>
</header>

<main class="main">
  <div class="view-container" id="viewContainer"></div>

  <!-- Панель событий выбранного дня -->
  <section class="day-panel" id="dayPanel" aria-label="События дня">
    <div class="day-panel-inner">
      <div class="day-panel-content">
        <div class="panel-header">
          <div class="panel-title">
            <span id="panelTitle"></span>
          </div>
          <button class="panel-add-btn" id="panelAddBtn">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Событие
          </button>
          <button class="panel-close" id="panelCloseBtn" title="Закрыть" aria-label="Закрыть">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="events-list" id="eventsList"></div>
      </div>
    </div>
  </section>
</main>

<!-- Модальное окно события -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="eventModalTitle">
    <h2 id="eventModalTitle">Новое событие</h2>
    <div class="field">
      <label for="evTitle">Название</label>
      <input type="text" id="evTitle" maxlength="200" placeholder="Что за событие?">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="evDate">Дата</label>
        <input type="date" id="evDate">
      </div>
      <div class="field">
        <label for="evStart">Начало</label>
        <input type="time" id="evStart" value="10:00">
      </div>
      <div class="field">
        <label for="evEnd">Конец</label>
        <input type="time" id="evEnd" value="11:00">
      </div>
    </div>
    <div class="field">
      <label for="evRepeat">Повторение</label>
      <div class="select-wrapper">
        <select id="evRepeat">
          <option value="none">Не повторять</option>
          <option value="daily">Каждый день</option>
          <option value="weekly">Каждую неделю</option>
          <option value="monthly">Каждый месяц</option>
          <option value="yearly">Каждый год</option>
        </select>
      </div>
    </div>
    <div class="repeat-opts" id="repeatOpts" hidden>
      <div class="field-row">
        <div class="field">
          <label for="evInterval" id="intervalLabel">Интервал</label>
          <input type="number" id="evInterval" min="1" max="99" value="1" inputmode="numeric">
        </div>
        <div class="field">
          <label for="evUntil">Повторять до</label>
          <input type="date" id="evUntil">
        </div>
      </div>
      <div class="field" id="weekdaysField" hidden>
        <label>По дням недели</label>
        <div class="weekday-picker" id="weekdayPicker"></div>
      </div>
    </div>
    <div class="field">
      <label>Цвет события</label>
      <div class="cat-picker" id="catPicker"></div>
    </div>
    <div class="field">
      <label for="evCategory">Категория события</label>
      <div class="select-wrapper">
        <select id="evCategory"></select>
      </div>
    </div>
    <div class="field">
      <label for="evLocation">Место</label>
      <input type="text" id="evLocation" maxlength="500" placeholder="Где проходит?">
    </div>
    <div class="field">
      <label for="evDesc">Описание</label>
      <textarea id="evDesc" rows="2" maxlength="2000" placeholder="Детали..."></textarea>
    </div>
    <div class="field">
      <label>Прикрепить файлы</label>
      <button type="button" class="attach-btn" id="attachFileBtn"></button>
      <div class="attach-file-list" id="attachFileList"></div>
      <input type="file" id="eventFileInput" multiple hidden>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="modalCancel">Отмена</button>
      <button class="btn-primary" id="modalSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- Модальное окно Gist -->
<div class="modal-overlay" id="gistModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="gistModalTitle">
    <h2 id="gistModalTitle">GitHub Gist синхронизация</h2>
    <div class="field">
      <label for="gistId">Gist ID</label>
      <input type="text" id="gistId" placeholder="например, a1b2c3d4e5f6..." autocomplete="off">
    </div>
    <div class="field">
      <label for="gistToken">Personal Access Token</label>
      <input type="password" id="gistToken" placeholder="ghp_..." autocomplete="off">
    </div>
    <p class="field-hint">
      Токен хранится только в вашем браузере (localStorage). Создайте токен с правами <code>gist</code> на
      <a href="https://github.com/settings/tokens" target="_blank" rel="noopener noreferrer">github.com/settings/tokens</a>.
    </p>
    <div class="modal-actions">
      <button class="btn-ghost" id="gistCancel">Отмена</button>
      <button class="btn-primary" id="gistSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- Модальное окно настроек -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
    <h2 id="settingsModalTitle">Настройки</h2>
    <div class="field">
      <label for="setTheme">Тема оформления</label>
      <div class="select-wrapper">
        <select id="setTheme">
          <option value="auto">Системная</option>
          <option value="light">Светлая</option>
          <option value="dark">Тёмная</option>
          <option value="sepia">Сепия</option>
          <option value="ocean">Океан</option>
          <option value="forest">Лесная</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="setFirstDay">Первый день недели</label>
      <div class="select-wrapper">
        <select id="setFirstDay">
          <option value="1">Понедельник</option>
          <option value="0">Воскресенье</option>
          <option value="6">Суббота</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="setWeekend">Выходные</label>
      <div class="select-wrapper">
        <select id="setWeekend">
          <option value="6,0">Суббота и воскресенье</option>
          <option value="0">Только воскресенье</option>
          <option value="1,6">Суббота и понедельник</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="setTimeFormat">Формат времени</label>
      <div class="select-wrapper">
        <select id="setTimeFormat">
          <option value="24">24-часовой</option>
          <option value="12">12-часовой (AM/PM)</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="setHourHeight">Масштаб сетки дня и недели</label>
      <div class="select-wrapper">
        <select id="setHourHeight">
          <option value="40">Компактный</option>
          <option value="56">Обычный</option>
          <option value="80">Крупный</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="settingsCancel">Отмена</button>
      <button class="btn-primary" id="settingsSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- Выбор области действия для повторяющегося события -->
<div class="modal-overlay" id="scopeModal">
  <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="scopeTitle">
    <h2 id="scopeTitle">Повторяющееся событие</h2>
    <p class="scope-text" id="scopeText"></p>
    <div class="scope-actions">
      <button class="btn-primary" data-scope="this">Только это событие</button>
      <button class="btn-primary alt" data-scope="all">Вся серия</button>
      <button class="btn-ghost" data-scope="cancel">Отмена</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Порядок важен: скрипты классические (без ES-модулей), чтобы работать по file:// -->
<script src="js/config.js?v=6"></script>
<script src="js/utils.js?v=6"></script>
<script src="js/recurrence.js?v=6"></script>
<script src="js/settings.js?v=6"></script>
<script src="js/attachments.js?v=6"></script>
<script src="js/storage.js?v=6"></script>
<script src="js/gist.js?v=6"></script>
<script src="js/events.js?v=6"></script>
<script src="js/render.js?v=6"></script>
<script src="js/drag.js?v=6"></script>
<script src="js/select.js?v=6"></script>
<script src="js/ui.js?v=6"></script>
<script src="js/main.js?v=6"></script>
</body>
</html>
